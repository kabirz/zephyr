description: |
  Flash memory binding of GD32 FMC v4.

  GD32 series use this type flash memory:
    - GD32H7xx

  The main flash array is divided into uniform 4KB sectors, erased by
  address and programmed by word (32-bit).

include: soc-nv-flash.yaml

compatible: "gd,gd32-nv-flash-v4"

properties:
  max-erase-time-ms:
    type: int
    required: true
    description: max erase time(millisecond) of a flash sector
