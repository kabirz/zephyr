description: |
  GigaDevice GD32H7xx CAN-FD controller (mailbox / message RAM based).
  Interrupt names: wkup, message, busoff, error, fasterror, tec, rec.

compatible: "gd,gd32-can"

include: [can-fd-controller.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true

  resets:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
